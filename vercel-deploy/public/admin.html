<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - AmritaCare</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --muted: #6b7280;
      --text: #0f172a;
      --accent-1: #6366f1;
      --accent-2: #8b5cf6;
      --glow-light: rgba(99,102,241,0.10);
      --glow-strong: rgba(139,92,246,0.08);
    }
    .dark {
      --bg: #071428;
      --card-bg: #0b1b2a;
      --muted: #9ca3af;
      --text: #e6eef7;
      --glow-light: rgba(99,102,241,0.06);
      --glow-strong: rgba(139,92,246,0.16);
    }
    body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
    .card { background: var(--card-bg); border-radius: 14px; box-shadow: 0 8px 30px rgba(2,6,23,0.06), 0 8px 30px var(--glow-light), 0 0 20px var(--glow-strong); transition: box-shadow .22s ease, transform .12s ease; }
    .card:hover { transform: translateY(-4px); box-shadow: 0 12px 36px rgba(2,6,23,0.08), 0 14px 40px var(--glow-light), 0 0 28px var(--glow-strong); }
    .toggle-switch { width: 56px; height: 30px; border-radius: 9999px; background: linear-gradient(90deg, var(--accent-1), var(--accent-2)); cursor: pointer; padding: 3px; display: inline-flex; align-items: center; transition: transform .28s ease; }
    .toggle-ball { width: 24px; height: 24px; border-radius: 9999px; background: #fff; transform: translateX(0); transition: transform .28s ease; display: flex; align-items: center; justify-content: center; font-size: 12px; }
    .dark .toggle-ball { transform: translateX(26px); background: #facc15; }
    .form-input { width: 100%; padding: 0.6rem 0.75rem; border: 1px solid rgba(2,6,23,0.06); border-radius: 8px; background: transparent; color: inherit; font-size: 1rem; }
    .form-input::placeholder { color: var(--muted); }
    .form-input:focus { outline: none; border-color: var(--accent-1); box-shadow: 0 8px 30px rgba(99,102,241,0.06); }
    button { cursor: pointer; border: none; border-radius: 6px; font-weight: 500; }
    .btn-primary { background: linear-gradient(135deg, #6366f1, #8b5cf6); color: white; padding: 0.6rem 1.2rem; }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(99,102,241,0.3); }
    .btn-danger { background: #ef4444; color: white; padding: 0.5rem 1rem; }
    .btn-danger:hover { background: #dc2626; }
    .btn-warning { background: #f59e0b; color: white; padding: 0.5rem 1rem; }
    .btn-secondary { background: rgba(99,102,241,0.1); color: #6366f1; padding: 0.5rem 1rem; }
    .btn-success { background: #10b981; color: white; padding: 0.5rem 1rem; }
    .badge { display: inline-block; padding: 0.3rem 0.7rem; border-radius: 4px; font-size: 0.75rem; font-weight: 600; }
    .badge-admin { background: rgba(34,197,94,0.1); color: #22c55e; }
    .badge-banned { background: rgba(239,68,68,0.1); color: #ef4444; }
    .tab-btn { background: none; border-bottom: 3px solid transparent; color: var(--muted); padding: 0.7rem 1.2rem; font-weight: 500; }
    .tab-btn.active { color: #6366f1; border-bottom-color: #6366f1; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .stat-card { background: var(--card-bg); border: 1px solid rgba(99,102,241,0.1); border-radius: 8px; padding: 1rem; text-align: center; }
    .stat-number { font-size: 2rem; font-weight: 700; color: #6366f1; margin-bottom: 0.5rem; }
    .list-item { background: var(--card-bg); border: 1px solid rgba(99,102,241,0.1); border-radius: 8px; padding: 1rem; margin-bottom: 0.8rem; display: flex; justify-content: space-between; align-items: center; }
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; }
    .modal-overlay.active { display: flex; }
    .modal-content { background: var(--card-bg); border-radius: 12px; padding: 2rem; max-width: 500px; width: 90%; }
    
    /* ===== REALTIME CHAT STYLING ===== */
    #chatCard {
      display: flex;
      flex-direction: column;
      gap: 0;
    }
    #chatWindow {
      max-height: 250px !important;
      overflow-y: auto !important;
      overflow-x: hidden !important;
      display: flex !important;
      flex-direction: column !important;
      gap: 8px !important;
      background: var(--card-bg) !important;
      border-radius: 8px !important;
      padding: 12px !important;
      scroll-behavior: smooth !important;
      margin-bottom: 12px !important;
    }
    #chatWindow::-webkit-scrollbar {
      width: 6px;
    }
    #chatWindow::-webkit-scrollbar-track {
      background: rgba(99, 102, 241, 0.05);
      border-radius: 10px;
    }
    #chatWindow::-webkit-scrollbar-thumb {
      background: rgba(99, 102, 241, 0.3);
      border-radius: 10px;
    }
    #chatWindow::-webkit-scrollbar-thumb:hover {
      background: rgba(99, 102, 241, 0.5);
    }
    .dark #chatWindow::-webkit-scrollbar-thumb {
      background: rgba(139, 92, 246, 0.3);
    }
    .dark #chatWindow::-webkit-scrollbar-thumb:hover {
      background: rgba(139, 92, 246, 0.5);
    }
    .chat-message-other {
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: flex-start;
    }
    .chat-message-own {
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: flex-start;
      flex-direction: row;
    }
    .chat-avatar {
      width: 32px;
      height: 32px;
      min-width: 32px;
      min-height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white;
      font-weight: 700;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .chat-content {
      display: flex;
      flex-direction: column;
      gap: 3px;
      max-width: 70%;
      word-wrap: break-word;
    }
    .chat-message-own .chat-content {
      align-items: flex-start;
      text-align: left;
    }
    .chat-message-other .chat-content {
      align-items: flex-start;
      text-align: left;
    }
    .chat-header {
      font-size: 11px;
      color: var(--muted);
      font-weight: 500;
    }
    .chat-header strong {
      color: var(--text);
      font-weight: 600;
      margin-right: 4px;
    }
    .chat-message-own .chat-header strong {
      margin-right: 4px;
      margin-left: 0;
    }
    .chat-bubble-own,
    .chat-bubble-other {
      padding: 8px 12px;
      border-radius: 12px;
      line-height: 1.3;
      word-wrap: break-word;
      font-size: 13px;
      background: var(--card-bg);
      color: var(--text);
      border: 1px solid rgba(99, 102, 241, 0.2);
      border-radius: 12px;
    }
    .chat-bubble-own {
      background: var(--card-bg);
      color: var(--text);
      border: 1px solid rgba(99, 102, 241, 0.2);
      border-radius: 12px;
    }
    .chat-bubble-other {
      background: var(--card-bg);
      color: var(--text);
      border: 1px solid rgba(99, 102, 241, 0.2);
      border-radius: 12px;
    }
    .dark .chat-bubble-other {
      border-color: rgba(139, 92, 246, 0.3);
    }
    .dark .chat-bubble-own {
      border-color: rgba(139, 92, 246, 0.3);
    }
    .chat-actions {
      display: flex;
      gap: 4px;
      font-size: 10px;
    }
    .report-btn {
      background: none;
      border: none;
      color: var(--accent-2);
      cursor: pointer;
      font-size: 10px;
      padding: 2px 6px;
    }
  </style>
</head>
<body>
  <header class="bg-white dark:bg-gray-900 border-b border-gray-200 dark:border-gray-700 sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
      <h1 class="text-xl font-bold text-indigo-700 dark:text-indigo-300">Admin Dashboard</h1>
      <div class="flex items-center gap-3">
        <div id="themeToggle" class="toggle-switch" role="button" tabindex="0"><div id="toggleBall" class="toggle-ball">🌙</div></div>
        <button id="logoutBtn" class="btn-danger text-sm">Logout</button>
      </div>
    </div>
  </header>

  <div id="loginModal" class="modal-overlay active">
    <div class="modal-content">
      <h2 style="font-size: 1.3rem; font-weight: 700; margin-bottom: 1rem;">Admin Login</h2>
      <p style="color: var(--muted); margin-bottom: 1.5rem;">Enter your credentials</p>
      <div style="display: flex; flex-direction: column; gap: 1rem; margin-bottom: 1.5rem;">
        <input id="loginUser" type="text" class="form-input" placeholder="Username" autocomplete="username">
        <input id="loginPass" type="password" class="form-input" placeholder="Password" autocomplete="current-password">
      </div>
      <div style="display: flex; gap: 1rem; justify-content: flex-end;">
        <button id="loginCancel" class="btn-secondary">Back to Home</button>
        <button id="loginSubmit" class="btn-primary">Login</button>
      </div>
    </div>
  </div>

  <div id="confirmModal" class="modal-overlay">
    <div class="modal-content">
      <h2 style="font-size: 1.3rem; font-weight: 700; margin-bottom: 1rem;" id="confirmTitle">Confirm</h2>
      <p style="color: var(--muted); margin-bottom: 1.5rem;" id="confirmMessage">Are you sure?</p>
      <div style="display: flex; gap: 1rem; justify-content: flex-end;">
        <button id="confirmCancel" class="btn-secondary">Cancel</button>
        <button id="confirmOk" class="btn-danger">Confirm</button>
      </div>
    </div>
  </div>

  <main class="max-w-7xl mx-auto px-4 py-8 min-h-screen" style="display: none;" id="mainContent">
    <section class="mb-8">
      <h2 class="text-2xl font-bold mb-4">Dashboard</h2>
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
        <div class="stat-card"><div class="stat-number" id="totalMessages">0</div><div class="text-sm text-gray-600">Messages</div></div>
        <div class="stat-card"><div class="stat-number" id="totalReports">0</div><div class="text-sm text-gray-600">Reports</div></div>
        <div class="stat-card"><div class="stat-number" id="totalBanned">0</div><div class="text-sm text-gray-600">Banned</div></div>
        <div class="stat-card"><div class="stat-number" id="totalAdmins">0</div><div class="text-sm text-gray-600">Admins</div></div>
      </div>
    </section>

    <section>
      <div style="display: flex; gap: 0.5rem; border-bottom: 2px solid #e5e7eb; margin-bottom: 2rem; overflow-x: auto;">
        <button class="tab-btn active" data-tab="reports">Reports</button>
        <button class="tab-btn" data-tab="users">Users</button>
        <button class="tab-btn" data-tab="admins">Admins</button>
        <button class="tab-btn" data-tab="activity">Activity</button>
        <button class="tab-btn" data-tab="settings">Settings</button>
      </div>

      <div id="reports-tab" class="tab-content active" style="background: var(--card-bg); border-radius: 8px; padding: 1.5rem;"><div id="reportsList"></div></div>
      <div id="users-tab" class="tab-content" style="background: var(--card-bg); border-radius: 8px; padding: 1.5rem;"><input id="userSearch" type="text" class="form-input mb-4" placeholder="Search..."><div id="usersList"></div></div>
      <div id="admins-tab" class="tab-content" style="background: var(--card-bg); border-radius: 8px; padding: 1.5rem;"><div style="background: rgba(99,102,241,0.05); border: 1px solid rgba(99,102,241,0.2); border-radius: 8px; padding: 1rem; margin-bottom: 2rem;"><p style="font-weight: 600; margin-bottom: 1rem;">Add New Admin</p><div style="display: flex; gap: 0.5rem;"><input id="newAdminEmail" type="email" class="form-input" placeholder="Email" style="flex: 1;"><button id="addAdminBtn" class="btn-primary">Add</button></div></div><div id="adminsList"></div></div>
      <div id="activity-tab" class="tab-content" style="background: var(--card-bg); border-radius: 8px; padding: 1.5rem;"><div id="activityList"></div></div>
      <div id="settings-tab" class="tab-content" style="background: var(--card-bg); border-radius: 8px; padding: 1.5rem;"><button id="clearAllBtn" class="btn-danger" style="margin-right: 1rem;">Clear All Messages</button><button id="exportBtn" class="btn-secondary">Export Data</button></div>
    </section>
  </main>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js';
    import { getFirestore, collection, query, onSnapshot, orderBy, getDocs, addDoc, deleteDoc, doc, writeBatch, where, Timestamp } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js';

    let currentAdmin = null;
    let firebaseReady = false;
    let db = null;
    let allReports = [];
    let allUsers = new Map();
    let allAdmins = new Set();
    let allBanned = new Set();
    let activityLog = [];

    async function initFirebase() {
      try {
        const response = await fetch('/api/firebase-config');
        if (!response.ok) throw new Error('Firebase unavailable');
        const firebaseConfig = await response.json();
        const app = initializeApp(firebaseConfig);
        db = getFirestore(app);
        firebaseReady = true;
        console.log('✅ Firebase initialized');
      } catch (err) {
        console.warn('⚠️ Firebase offline - will use offline mode when logged in');
        firebaseReady = false;
      }
    }

    function loginLocal() {
      const username = document.getElementById('loginUser').value.trim();
      const password = document.getElementById('loginPass').value;
      if (!username || !password) { alert('Enter credentials'); return; }
      
      const loginBtn = document.querySelector('#loginModal button');
      loginBtn.disabled = true;
      loginBtn.textContent = 'Logging in...';
      
      fetch('/api/admins/validate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      }).then(r => {
        if (!r.ok) throw new Error(`Server error: ${r.status}`);
        return r.json();
      }).then(data => {
        if (!data || !data.ok) throw new Error('Invalid credentials');
        currentAdmin = { name: username };
        sessionStorage.setItem('admin_user', username);
        showMainUI();
      }).catch(err => {
        console.error('Login error:', err);
        alert('Login failed: ' + err.message);
      }).finally(() => {
        loginBtn.disabled = false;
        loginBtn.textContent = 'Login';
      });
    }

    function logout() {
      currentAdmin = null;
      sessionStorage.removeItem('admin_user');
      document.getElementById('loginModal').classList.add('active');
      document.getElementById('mainContent').style.display = 'none';
    }

    function showMainUI() {
      document.getElementById('loginModal').classList.remove('active');
      document.getElementById('mainContent').style.display = 'block';
      loadAllData();
    }

    async function loadAllData() {
      updateStats();
      if (firebaseReady && db) {
        loadReports(); loadUsers(); loadAdmins(); loadBans();
      } else {
        renderReports(); renderUsers(); renderAdmins();
      }
    }

    function loadReports() {
      if (!db) return;
      onSnapshot(query(collection(db, 'reports'), orderBy('reportedAt', 'desc')), snap => {
        allReports = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        renderReports(); updateStats();
      });
    }

    function loadUsers() {
      if (!db) return;
      onSnapshot(collection(db, 'users'), snap => {
        allUsers.clear();
        snap.docs.forEach(d => allUsers.set(d.data().email || d.id, d.id));
        renderUsers();
      });
    }

    function loadAdmins() {
      if (!db) return;
      onSnapshot(collection(db, 'admins'), snap => {
        allAdmins.clear();
        snap.docs.forEach(d => allAdmins.add(d.data().email || d.id));
        renderAdmins(); updateStats();
      });
    }

    function loadBans() {
      if (!db) return;
      onSnapshot(collection(db, 'bans'), snap => {
        allBanned.clear();
        snap.docs.forEach(d => allBanned.add(d.data().uid || d.id));
        renderUsers(); updateStats();
      });
    }

    function renderReports() {
      const list = document.getElementById('reportsList');
      if (allReports.length === 0) { list.innerHTML = '<p style="color: var(--muted);">No reports.</p>'; return; }
      list.innerHTML = allReports.map(r => `
        <div class="list-item">
          <div style="flex: 1;">
            <div style="font-weight: 600; margin-bottom: 0.3rem;">${esc(r.chatMessage || 'Unknown')}</div>
            <div style="font-size: 0.85rem; color: var(--muted);">By: ${esc(r.chatAuthor || '?')}</div>
          </div>
          <div style="display: flex; gap: 0.5rem;">
            <button class="btn-danger" onclick="window.deleteChat('${r.chatId}')">Delete</button>
            <button class="btn-warning" onclick="window.banUser('${r.chatAuthor}')">Ban</button>
          </div>
        </div>
      `).join('');
    }

    function renderUsers() {
      const list = document.getElementById('usersList');
      const search = (document.getElementById('userSearch')?.value || '').toLowerCase();
      // offline mode: read from localStorage if no firebase
      const stored = JSON.parse(localStorage.getItem('mh_demo_accounts_v2') || '[]');
      const filtered = stored.filter(u => !search || (u.email||'').toLowerCase().includes(search) || (u.name||'').toLowerCase().includes(search));
      list.innerHTML = filtered.map(u => `<div class="list-item"><div><strong>${esc(u.name||u.email)}</strong><div style="font-size:0.85rem;color:var(--muted)">${esc(u.email)}</div></div><div><button class="btn-danger" onclick="window.banUser('${esc(u.email)}')">Ban</button></div></div>`).join('') || '<p style="color:var(--muted)">No users</p>';
    }

    function renderAdmins() {
      const list = document.getElementById('adminsList');
      const stored = JSON.parse(localStorage.getItem('mh_admins_local') || '[]');
      list.innerHTML = stored.map(a => `<div class="list-item"><div>${esc(a)}</div><div><button class="btn-danger" onclick="window.removeAdmin('${esc(a)}')">Remove</button></div></div>`).join('') || '<p style="color:var(--muted)">No admins</p>';
    }

    function updateStats(){
      const messages = JSON.parse(localStorage.getItem('mh_chat_messages')||'[]');
      const reports = JSON.parse(localStorage.getItem('mh_reported_chats')||'[]');
      const banned = JSON.parse(localStorage.getItem('mh_banned_users')||'[]');
      const admins = JSON.parse(localStorage.getItem('mh_admins')||'[]');
      document.getElementById('totalMessages').innerText = messages.length;
      document.getElementById('totalReports').innerText = reports.length;
      document.getElementById('totalBanned').innerText = banned.length;
      document.getElementById('totalAdmins').innerText = (admins && admins.length) || 1;
    }

    // small helper
    function esc(s){ return String(s||'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;'); }

    document.getElementById('loginSubmit').addEventListener('click', loginLocal);
    document.getElementById('loginCancel').addEventListener('click', ()=> window.location.href = '/');

    // wire up add admin
    document.getElementById('addAdminBtn').addEventListener('click', ()=>{
      const email = document.getElementById('newAdminEmail').value.trim().toLowerCase();
      if(!email) return alert('Enter email');
      const arr = JSON.parse(localStorage.getItem('mh_admins')||'[]'); if(!arr.includes(email)) arr.push(email); localStorage.setItem('mh_admins', JSON.stringify(arr)); renderAdmins(); updateStats(); alert('Admin added locally');
    });

    // init
    (function(){
      const existing = sessionStorage.getItem('admin_user');
      if(existing){ showMainUI(); }
      initFirebase();
    })();
  </script>
</body>
</html>
